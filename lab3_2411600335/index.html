<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickCart | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
    <section class="card login-card shadow-lg border-0">
      <header class="login-card-header text-center text-white">
        <div class="brand-icon">QC</div>
        <h1 class="h3 mb-1">QuickCart</h1>
        <p class="mb-0">E-commerce Admin Dashboard</p>
      </header>

      <div class="card-body p-4 p-md-5">
        <div id="loginFeedback"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control form-control-lg" id="username"
                   placeholder="Enter username" autocomplete="username">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control form-control-lg" id="password"
                   placeholder="Enter password" autocomplete="current-password">
          </div>

          <button type="button" id="loginBtn" class="btn btn-primary btn-lg w-100">
            Login
          </button>
        </form>

        <div class="demo-box mt-4">
          <small><strong>Demo account</strong><br>Username: admin<br>Password: password123</small>
        </div>
      </div>

      <footer class="text-center small text-muted pb-4">
        QuickCart Admin • Laboratory Exercise 3
      </footer>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
