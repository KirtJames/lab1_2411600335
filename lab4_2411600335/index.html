<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickCart - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="container">
<div class="row justify-content-center align-items-center min-vh-100">
<div class="col-11 col-sm-8 col-md-5 col-lg-4">
<div class="card login-card shadow">
<div class="card-body p-4">
<div class="text-center mb-4">
<h1 class="brand-title">QuickCart</h1>
<p class="text-muted">E-commerce Admin Dashboard</p>
</div>
<form id="loginForm">
<div class="mb-3"><label for="username" class="form-label">Username</label><input id="username" class="form-control" required></div>
<div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" class="form-control" required></div>
<div id="loginMessage" class="alert d-none"></div>
<button class="btn btn-primary w-100" type="submit">Login</button>
</form>
<p class="small text-muted text-center mt-3 mb-0">Demo: admin / password123</p>
</div></div></div></div></div>
<script src="js/login.js"></script>
</body>
</html>
